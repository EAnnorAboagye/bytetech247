# Decap CMS. Publishing commits to main, which triggers the Cloudflare
# deploy. Login needs a GitHub OAuth app — see the /api/auth routes in
# worker/index.ts.
#
# Field rules follow Google Search Central (helpful, people-first
# content, updated 2026-10-05) and this site's write-article checklist:
# one purpose per page, a concise title, a real description, headings
# that are questions, one H1 only (the title), and FAQ only for real
# follow-ups. Crawl and index are automatic: the build adds the URL to
# the sitemap and emits BlogPosting JSON-LD. Do not add ad code here.

backend:
  name: github
  repo: EAnnorAboagye/bytetech247
  branch: main
  base_url: https://bytetech247.com
  auth_endpoint: api/auth

media_folder: src/content/blog
public_folder: src/content/blog

site_url: https://bytetech247.com
display_url: https://bytetech247.com
logo_url: /favicon.svg

# Preview pane is on. It shows the Markdown, not the live page chrome.
editor:
  preview: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Posts
    label_singular: Post
    folder: src/content/blog
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    extension: mdx
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{category}} — {{date}}"
    sortable_fields: [date, title, commit_date]
    view_filters:
      - label: Dev Tools
        field: category
        pattern: dev-tools
      - label: Data & Automation
        field: category
        pattern: data-automation
      - label: AI Productivity
        field: category
        pattern: ai-productivity
      - label: Guides & Fixes
        field: category
        pattern: guides-fixes
    fields:
      - label: Title
        name: title
        widget: string
        pattern: [".{1,60}", "60 characters or fewer"]
        hint: "The page's only H1, and the search title. State the page's purpose in plain words. No clickbait. 60 characters or fewer — Google truncates longer titles."
      - label: Description
        name: description
        widget: text
        pattern: [".{1,160}", "160 characters or fewer"]
        hint: "The search snippet, not a summary for someone already on the page. Include the phrase a searcher would type. 160 characters or fewer."
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        hint: "Shown as datePublished. Do not change it later just to look fresh — Google flags date changes that are not real updates."
      - label: Category
        name: category
        widget: select
        options:
          - { label: Dev Tools, value: dev-tools }
          - { label: Data & Automation, value: data-automation }
          - { label: AI Productivity, value: ai-productivity }
          - { label: Guides & Fixes, value: guides-fixes }
      - label: Tags
        name: tags
        widget: list
        default: []
        hint: "Reuse a tag that already groups posts. A tag used once is noise and does not help crawl or ranking."
      - label: Cover image
        name: coverImage
        widget: image
        choose_url: false
        hint: "Required. A real screenshot or diagram of the thing the post is about. This is the article image in BlogPosting schema and the page's LCP candidate — keep it relevant, not decorative."
      - label: Cover image alt
        name: coverImageAlt
        widget: string
        hint: "Describe what the image shows, in words a reader who cannot see it would need. Do not repeat the title."
      - label: Cover credit
        name: coverImageCredit
        widget: object
        required: false
        hint: "Only for a sourced photo. Leave empty for your own screenshot."
        fields:
          - { label: Photographer, name: name, widget: string, required: false }
          - { label: Credit URL, name: url, widget: string, required: false }
      - label: Series
        name: series
        widget: string
        required: false
        hint: "Only if this post is part of a cluster. Must be set together with Series order."
      - label: Series order
        name: seriesOrder
        widget: number
        value_type: int
        required: false
        min: 1
        hint: "1 is the pillar. Required together with Series."
      - label: Related slugs
        name: relatedSlugs
        widget: list
        required: false
        default: []
        hint: "Slugs of posts a reader should open next. This is the internal link, which is how Google finds related pages."
      - label: FAQ
        name: faq
        widget: list
        required: false
        default: []
        hint: "Only questions a reader still has after the body. These become visible FAQ and FAQPage schema. Invented questions are stuffing — leave empty."
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - label: Body
        name: body
        widget: markdown
        hint: "Markdown, not HTML. No # heading — the title is the only H1, and a # in the body fails the build. Each ## is one real sub-question, in the order a reader asks. Open with the problem, then a Quick Answer, then the steps. Back every claim with a command, a number, or something you tested. Say who tested it. Do not write to a word count."
        default: |
          State the problem in two or three sentences, in the words a reader would use. Say who this is for.

          ## Quick Answer

          The shortest true answer, with the actual command or setting. A reader who stops here should still leave with the fix.

          ## What is actually going wrong

          The cause, not a restatement of the title. One point, backed by a command output or a number.

          ## How to fix it

          Steps you have run. One step per block. Name the file and the version.

          ```bash
          # the command you actually ran
          ```

          ## What to check if it still fails

          The one or two things that usually get missed.
