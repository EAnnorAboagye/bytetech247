<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ByteTech247 — Posts</title>
  </head>
  <body>
    <!-- Same pass-through policy BaseLayout registers. The site CSP
         requires Trusted Types, and this page is static, so without
         this the editor cannot inject its own markup and renders blank. -->
    <script>
      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        window.trustedTypes.createPolicy("default", {
          createHTML: function (html) {
            return html;
          },
          createScript: function (script) {
            return script;
          },
          createScriptURL: function (url) {
            return url;
          },
        });
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  </body>
</html>
