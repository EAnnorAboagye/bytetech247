# build-spec.md Phase 11 / §11: a single native Cloudflare Worker named
# "bytetech247" — deliberately not Cloudflare Pages. Serves the static
# Astro build via the [assets] binding and handles a small number of
# dynamic routes in worker/index.ts, falling through to static-asset
# serving for everything else. The custom domain bytetech247.com (bound
# in the dashboard under Settings -> Domains & Routes) is the only
# public entry point.
name = "bytetech247"
main = "worker/index.ts"
compatibility_date = "2026-07-30"
# wrangler's own default is workers_dev = true, which would publish this
# same Worker (identical content, no canonical redirect) a second time at
# bytetech247.workers.dev — an unbranded, unintended duplicate of the
# live site. Pinned to false so that stays true regardless of any future
# dashboard toggle or teammate's local Wrangler default.
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
# Without this, Workers Static Assets returns an empty-body 404 for any
# unmatched route even though dist/404.html exists — "404-page" tells it
# to actually serve that file (with a real 404 status) instead.
not_found_handling = "404-page"
# Cloudflare's documented default: a request that matches a real static
# asset file (which the homepage and every article page do — they're
# built as index.html) is served directly from the assets store, WITHOUT
# ever invoking worker/index.ts's fetch(). Confirmed live: the RFC 8288
# Link header and Accept: text/markdown negotiation added to fetch() had
# zero effect in production until this was set, because those requests
# never reached that code at all. This makes every request run the
# Worker first, which then explicitly defers to env.ASSETS.fetch() for
# anything it doesn't care about — the same pattern Cloudflare's own
# migration guide uses whenever Worker logic needs to run ahead of asset
# serving (auth checks, logging, or — here — response-header injection).
run_worker_first = true

# Real namespaces already provisioned in the Cloudflare account (created
# 2026-07-29) — bound here rather than re-created. If these ever need to
# be recreated, run `wrangler kv namespace create` and update the ids
# below.
[[kv_namespaces]]
binding = "COUNTERS_KV"
id = "c7eee15b1c3845f5b5da81c8ac614320"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "e0a5e383f6b14dee8b8c5c14045e614c"

# MCP Compatibility Checker (worker/lib/lemon-squeezy.ts) — the store and
# variant IDs identify which product a checkout is created against, not
# sensitive on their own (visible in every hosted checkout URL Lemon
# Squeezy generates), so they live here as plain vars rather than secrets.
# LEMON_SQUEEZY_API_KEY and LEMON_SQUEEZY_WEBHOOK_SECRET are real secrets —
# set via `wrangler secret put`, never here.
[vars]
LEMON_SQUEEZY_STORE_ID = "452265"
LEMON_SQUEEZY_VARIANT_ID = "2019621"
